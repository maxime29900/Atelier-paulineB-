<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier PaulineB — Disponibilités V9</title>
<style>
:root{--a:#d58eaa;--ink:#33282d;--muted:#88777e;--line:#eadde3;--soft:#fff7fa;--ok:#e5f4e9;--okink:#397a4f}
*{box-sizing:border-box}body{margin:0;background:#f6f0f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:440px;margin:auto;background:#fff;min-height:100vh}.top{text-align:center;padding:20px;border-bottom:1px solid var(--line)}
.logo{font:27px Georgia,serif}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.nav h2{font-size:17px;margin:0;text-transform:capitalize}.icon{width:44px;height:44px;border:0;border-radius:13px;background:#f4edf0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 10px}.wd{text-align:center;color:var(--muted);font-size:10px;padding:4px}.cell{min-height:62px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:6px;cursor:pointer}.cell.sel{border:2px solid var(--a)}.num{font-size:12px;font-weight:800}.count{display:block;margin-top:6px;background:var(--ok);color:var(--okink);font-size:8px;font-weight:800;border-radius:7px;padding:4px;line-height:1.2}
.card{margin:16px;border:1px solid var(--line);border-radius:18px;padding:16px}.card h3{margin:0 0 5px;font-size:16px}.hint{font-size:11px;color:var(--muted)}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:13px}.slot{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid #cfe7d5;border-radius:11px;background:var(--ok);color:var(--okink);font-weight:800;font-size:13px}.remove{border:0;background:#fff;border-radius:8px;color:#8b6975;padding:6px 8px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:13px;padding:13px;font-size:14px;font-weight:800}.main{background:var(--a);color:#fff}.soft{background:#f4edf0;color:#46373e}
.form{display:none}.form.show{display:block}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.quick button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;font-size:11px}
.ig{display:none}.ig.show{display:block}.story{width:100%;max-width:100%;box-sizing:border-box;overflow:hidden;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.storytitle{font:27px Georgia,serif}.storysub{font-size:10px;font-weight:900;margin:3px 0 10px}.igweek,.iggrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%;box-sizing:border-box}.igweek{color:var(--muted);font-size:8px;font-weight:800}.iggrid{margin-top:3px}.igday{min-width:0;min-height:62px;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;background:#fff;padding:4px;text-align:left;overflow:hidden}.igday.empty{border:0;background:transparent}.igdate{font-size:9px;font-weight:900}.igtimes{display:flex;flex-direction:column;gap:2px;margin-top:3px;min-width:0}.igtimes span{font-size:7px;background:#e2f2e6;color:#397a4f;border-radius:3px;padding:2px;font-weight:800;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.igfree{font-size:6px;color:#397a4f;margin-top:8px;font-weight:800}.igfoot{font-size:9px;font-weight:700;margin-top:9px}
</style>
</head>
<body><main class="app">
<header class="top"><div class="logo">Atelier PaulineB</div><div class="sub">Créneaux disponibles · V9</div></header>
<div class="nav"><button class="icon" id="prev">‹</button><h2 id="month"></h2><button class="icon" id="next">›</button></div>
<div class="grid" id="cal"></div>
<section class="card">
<h3 id="dayTitle"></h3><div class="hint">Ajoute une plage disponible avec une durée libre. Exemple : 9h00 → 12h30.</div>
<div id="slots"></div>
<div class="actions"><button class="btn main" id="add">＋ Ajouter une plage</button><button class="btn soft" id="ig">📸 Instagram</button></div>
</section>
<section class="card form" id="formCard"><h3>Nouvelle disponibilité</h3>
<form id="form"><div class="field"><label>Date</label><input id="fdate" type="date" required></div>
<div class="field"><label>Début</label><input id="fstart" type="time" required></div>
<div class="field"><label>Fin</label><input id="fend" type="time" required></div>
<div class="quick"><button type="button" data-dur="60">+ 1 h</button><button type="button" data-dur="90">+ 1 h 30</button><button type="button" data-dur="120">+ 2 h</button><button type="button" data-dur="150">+ 2 h 30</button></div>
<div class="actions"><button class="btn main">Ajouter</button><button class="btn soft" type="button" id="cancel">Annuler</button></div></form></section>
<section class="card ig" id="igCard"><h3>Story Instagram</h3><div class="hint" style="margin-bottom:10px">Le visuel reprend exactement les créneaux enregistrés dans le calendrier.</div><div class="story" id="story"></div><div class="actions" style="margin-top:10px"><button class="btn main" id="exportInsta">📸 Enregistrer la photo</button><button class="btn soft" id="close">Fermer</button></div></section>
<script>
const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],W=["L","M","M","J","V","S","D"];
const demo=["2026-09-14|09:00|12:30","2026-09-14|14:00|15:30","2026-09-16|10:00|13:00","2026-09-18|09:00|10:30","2026-09-18|14:00|18:00"];
let slots=JSON.parse(localStorage.getItem("paulineb_availability")||"null")||demo;
let selected=new Date(2026,8,14),view=new Date(2026,8,1);
const pad=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function save(){localStorage.setItem("paulineb_availability",JSON.stringify(slots))}
function render(){
 const y=view.getFullYear(),m=view.getMonth();month.textContent=M[m]+" "+y;cal.innerHTML=W.map(x=>`<div class="wd">${x}</div>`).join("");
 const first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)cal.insertAdjacentHTML("beforeend","<div></div>");
 for(let n=1;n<=total;n++){let d=new Date(y,m,n),k=key(d),a=slots.filter(x=>x.startsWith(k+"|"));cal.insertAdjacentHTML("beforeend",`<button type="button" class="cell ${k===key(selected)?"sel":""}" data-k="${k}"><span class="num">${n}</span>${a.length?`<span class="count">${a.length} plage${a.length>1?"s":""}</span>`:""}</button>`)}
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.k+"T12:00:00");render()});
 dayTitle.textContent=`${selected.getDate()} ${M[selected.getMonth()]} ${selected.getFullYear()}`;
 let a=slots.filter(x=>x.startsWith(key(selected)+"|")).sort();
 slotsEl.innerHTML=a.length?`<div class="slots">${a.map((x)=>{let [,st,en]=x.split("|");return `<div class="slot"><span>🟢 ${st} → ${en}</span><button type="button" class="remove" data-remove="${x}">Supprimer</button></div>`}).join("")}</div>`:`<div class="hint" style="margin-top:12px">Aucune disponibilité enregistrée.</div>`;
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{slots=slots.filter(x=>x!==b.dataset.remove);save();render()});
}
prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};
add.onclick=()=>{fdate.value=key(selected);fstart.value="09:00";fend.value="12:00";formCard.classList.add("show");fstart.focus()};
cancel.onclick=()=>formCard.classList.remove("show");
document.querySelectorAll("[data-dur]").forEach(b=>b.onclick=()=>{if(!fstart.value)return;let [h,m]=fstart.value.split(":").map(Number),d=Number(b.dataset.dur),total=h*60+m+d;if(total>1439)total=1439;fend.value=`${pad(Math.floor(total/60))}:${pad(total%60)}`});
form.onsubmit=e=>{e.preventDefault();if(fstart.value>=fend.value){alert("L'heure de fin doit être après l'heure de début.");return}let v=fdate.value+"|"+fstart.value+"|"+fend.value;if(!slots.includes(v))slots.push(v);save();selected=new Date(fdate.value+"T12:00:00");view=new Date(selected.getFullYear(),selected.getMonth(),1);formCard.classList.remove("show");render()};
function getMonthSlots(y,m){
 const prefix=`${y}-${pad(m+1)}`;
 return slots.filter(x=>x.startsWith(prefix+"|"));
}
function buildInstagramPreview(y,m){
 const first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 let cells="";
 for(let i=0;i<first;i++)cells+=`<div class="igday empty"></div>`;
 for(let n=1;n<=total;n++){
   const d=new Date(y,m,n),k=key(d);
   const a=slots.filter(x=>x.startsWith(k+"|")).map(x=>x.split("|").slice(1)).sort();
   cells+=`<div class="igday"><div class="igdate">${n}</div>${a.length?`<div class="igtimes">${a.map(r=>`<span>${r[0]}–${r[1]}</span>`).join("")}</div>`:""}</div>`;
 }
 return `<div class="storytitle">Atelier PaulineB</div><div class="storysub">CRÉNEAUX DISPONIBLES · ${M[m].toUpperCase()} ${y}</div><div class="igweek">${W.map(x=>`<div>${x}</div>`).join("")}</div><div class="iggrid">${cells}</div><div class="igfoot">💌 Réservation en message privé</div>`;
}
ig.onclick=()=>{
 const y=view.getFullYear(),m=view.getMonth();
 story.innerHTML=buildInstagramPreview(y,m);
 igCard.classList.add("show");
};
close.onclick=()=>igCard.classList.remove("show");
const slotsEl=document.getElementById("slots");render();
</script></main>
</main>

<script>
function escSvg(v){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function exportInstagram(){
 const y=view.getFullYear(), m=view.getMonth(), W0=1080, H0=1920;
 const padX=70, top=210, titleY=285, subY=335, weekY=395;
 const gridX=70, gridY=430, gap=10, cols=7, cellW=(W0-2*gridX-gap*6)/7, cellH=235;
 const first=(new Date(y,m,1).getDay()+6)%7, total=new Date(y,m+1,0).getDate();
 let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W0}" height="${H0}" viewBox="0 0 ${W0} ${H0}">
 <rect width="1080" height="1920" fill="#fff7fa"/>
 <text x="540" y="${titleY}" text-anchor="middle" font-family="Georgia,serif" font-size="62" fill="#33282d">Atelier PaulineB</text>
 <text x="540" y="${subY}" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#33282d">CRÉNEAUX DISPONIBLES · ${escSvg(M[m].toUpperCase())} ${y}</text>`;
 const letters=["L","M","M","J","V","S","D"];
 letters.forEach((x,i)=>{
   const cx=gridX+i*(cellW+gap)+cellW/2;
   svg+=`<text x="${cx}" y="${weekY}" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#88777e">${x}</text>`;
 });
 for(let i=0;i<first;i++){}
 for(let n=1;n<=total;n++){
   const idx=first+n-1, row=Math.floor(idx/7), col=idx%7;
   const x=gridX+col*(cellW+gap), yy=gridY+row*(cellH+gap);
   const k=key(new Date(y,m,n));
   const a=slots.filter(v=>v.startsWith(k+"|")).map(v=>v.split("|").slice(1)).sort();
   svg+=`<rect x="${x}" y="${yy}" rx="18" width="${cellW}" height="${cellH}" fill="#ffffff" stroke="#eadde3" stroke-width="3"/>
          <text x="${x+18}" y="${yy+38}" font-family="Arial,sans-serif" font-size="27" font-weight="900" fill="#33282d">${n}</text>`;
   a.forEach((r,j)=>{
     const by=yy+72+j*50;
     svg+=`<rect x="${x+14}" y="${by}" rx="9" width="${cellW-28}" height="38" fill="#e2f2e6"/>
            <text x="${x+cellW/2}" y="${by+26}" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#397a4f">${escSvg(r[0])} – ${escSvg(r[1])}</text>`;
   });
 }
 const rows=Math.ceil((first+total)/7);
 const footY=gridY+rows*(cellH+gap)+55;
 svg+=`<text x="540" y="${footY}" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#33282d">💌 Réservation en message privé</text></svg>`;
 const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
 const url=URL.createObjectURL(blob), img=new Image();
 img.onload=()=>{
   const c=document.createElement("canvas"); c.width=W0; c.height=H0;
   const ctx=c.getContext("2d"); ctx.fillStyle="#fff7fa"; ctx.fillRect(0,0,W0,H0); ctx.drawImage(img,0,0);
   URL.revokeObjectURL(url);
   c.toBlob(async png=>{
     if(!png) return;
     const file=new File([png],"Atelier-PaulineB-disponibilites.png",{type:"image/png"});
     try{
       if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
         await navigator.share({files:[file],title:"Disponibilités Atelier PaulineB"});
       }else{
         const a=document.createElement("a"); a.href=URL.createObjectURL(png); a.download=file.name; a.click();
         setTimeout(()=>URL.revokeObjectURL(a.href),1500);
       }
     }catch(e){ if(e.name!=="AbortError") alert("Impossible d'enregistrer l'image."); }
   },"image/png");
 };
 img.src=url;
}
document.addEventListener("DOMContentLoaded",()=>{
 const b=document.getElementById("exportInsta");
 if(b) b.onclick=exportInstagram;
});
</script>
</body>
</html>
