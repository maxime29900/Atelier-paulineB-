<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier PaulineB — Disponibilités V10</title>
<style>
:root{--a:#cf8da8;--ink:#33282d;--muted:#88777e;--line:#eadde3;--soft:#fff7fa}
*{box-sizing:border-box}
body{margin:0;background:#f6f0f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:460px;margin:auto;background:#fff;min-height:100vh;padding-bottom:30px}
.top{text-align:center;padding:22px 18px 12px}.logo{font:32px Georgia,serif}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.nav h2{font-size:20px;margin:0;text-transform:capitalize}.icon{width:44px;height:44px;border:0;border-radius:14px;background:#f4edf0;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 12px}.wd{text-align:center;color:var(--muted);font-size:10px;padding:5px}.cell{min-width:0;min-height:68px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;padding:7px;cursor:pointer}.cell.sel{border:2px solid var(--a)}.num{font-size:13px;font-weight:900}.count{display:block;margin-top:7px;background:#e5f4e9;color:#397a4f;font-size:8px;font-weight:800;border-radius:7px;padding:4px;line-height:1.2;text-align:center}
.card{margin:16px;border:1px solid var(--line);border-radius:20px;padding:16px}.card h3{margin:0 0 6px;font-size:18px}.hint{font-size:12px;color:var(--muted);line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:14px;padding:13px;font-size:14px;font-weight:800}.main{background:var(--a);color:#fff}.soft{background:#f4edf0;color:#46373e}
.form{display:none}.form.show{display:block}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:18px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.type-option{border:2px solid transparent;border-radius:14px;padding:11px;text-align:left;font-weight:800;font-size:12px;cursor:pointer}.type-option.selected{border-color:#a95e79;box-shadow:0 0 0 2px rgba(169,94,121,.10)}
.type-all{background:#dfeedd;color:#477c52}.type-restricted{background:#f6cbd8;color:#9b4e67}.type-restricted{background:#dfcff2;color:#73529a}.type-jap{background:#f0dcc2;color:#966b42}
.slot-list{margin-top:13px}.slotrow{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;margin:7px 0}.slotdot{width:16px;height:16px;border-radius:50%;flex:0 0 16px}.slotinfo{flex:1;min-width:0}.slottime{font-size:18px;font-weight:900}.slottype{font-size:12px;line-height:1.25}.slotrow .btn{padding:8px 10px;font-size:11px}
.ig{display:none}.ig.show{display:block}.story{width:100%;overflow:hidden;background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:13px;text-align:center}.storytitle{font:27px Georgia,serif}.storysub{font-size:10px;font-weight:900;margin:4px 0 10px}.igweek,.iggrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%}.igweek{color:var(--muted);font-size:8px;font-weight:800}.igday{min-width:0;min-height:62px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:4px;text-align:left;overflow:hidden}.igday.empty{border:0;background:transparent}.igdate{font-size:9px;font-weight:900}.igtimes{display:flex;flex-direction:column;gap:2px;margin-top:3px}.igtimes span{font-size:8px;border-radius:4px;padding:3px 2px;font-weight:900;text-align:center;overflow:hidden;white-space:nowrap}
.iglegend{margin:16px auto 0;background:rgba(255,255,255,.75);border:1px solid #eadde3;border-radius:15px;padding:10px;text-align:left;font-size:10px;line-height:1.8}.iglegend>div{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
@media(max-width:390px){.type-grid{grid-template-columns:1fr}.cell{min-height:62px}.igday{min-height:58px}.igtimes span{font-size:7px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="logo">Atelier PaulineB</div><div class="sub">Créneaux disponibles · V10</div></header>
<div class="nav"><button class="icon" id="prev">‹</button><h2 id="month"></h2><button class="icon" id="next">›</button></div>
<div class="grid" id="cal"></div>

<section class="card">
<h3 id="dayTitle"></h3>
<div class="hint">Ajoute simplement l'heure de début et le type de prestation possible.</div>
<div id="slotList" class="slot-list"></div>
<div class="actions"><button class="btn main" id="add">＋ Ajouter un créneau</button><button class="btn soft" id="ig">📸 Instagram</button></div>
</section>

<section class="card form" id="formCard">
<h3>Nouveau créneau</h3>
<form id="form">
<div class="field"><label>Date</label><input id="fdate" type="date" required></div>
<div class="field"><label>Heure de début</label><input id="fstart" type="time" required></div>
<div class="hint">Choisis ce que tu acceptes sur ce créneau :</div>
<div class="type-grid" id="typeGrid">
<button type="button" class="type-option type-all selected" data-type="all">🟢 Toutes prestations</button>
<button type="button" class="type-option type-restricted" data-type="restricted">🌸 3 prestations uniquement</button>
<button type="button" class="type-option type-restricted" data-type="restricted">💜 3 prestations uniquement</button>
<button type="button" class="type-option type-jap" data-type="jap">🤍 3 prestations uniquement</button>
</div>
<div class="actions"><button class="btn main">Ajouter</button><button class="btn soft" type="button" id="cancel">Annuler</button></div>
</form>
</section>

<section class="card ig" id="igCard">
<h3>Story Instagram</h3>
<div class="hint">Le visuel reprend automatiquement les créneaux et leurs couleurs.</div>
<div class="story" id="story"></div>
<div class="actions"><button class="btn main" id="exportInsta">📸 Enregistrer la photo</button><button class="btn soft" id="close">Fermer</button></div>
</section>
</main>

<script>
const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const W=["L","M","M","J","V","S","D"];
const TYPES={
 all:{label:"Toutes prestations",bg:"#dfeedd",fg:"#477c52"},
 restricted:{label:"3 prestations uniquement",bg:"#f6cbd8",fg:"#9b4e67"},
 restricted:{label:"3 prestations uniquement",bg:"#dfcff2",fg:"#73529a"},
 jap:{label:"3 prestations uniquement",bg:"#f0dcc2",fg:"#966b42"}
};
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function loadSlots(){
 let raw=JSON.parse(localStorage.getItem("paulineb_availability")||"null");
 if(!Array.isArray(raw)) return [];
 // Compatibility with previous versions: date|start|end becomes date|start|all.
 return raw.map(v=>{
   const p=String(v).split("|");
   return p.length>=3 && TYPES[p[2]] ? `${p[0]}|${p[1]}|${p[2]}` : `${p[0]}|${p[1]}|all`;
 });
}
let slots=loadSlots();
let selected=new Date(2026,8,14);
let view=new Date(2026,8,1);
let selectedType="all";

function save(){localStorage.setItem("paulineb_availability",JSON.stringify(slots))}
function parse(v){let p=v.split("|");return {date:p[0],start:p[1]||"",type:TYPES[p[2]]?p[2]:"all"}}
function daySlots(d){return slots.filter(v=>v.startsWith(key(d)+"|")).map(parse).sort((a,b)=>a.start.localeCompare(b.start))}

function render(){
 const y=view.getFullYear(),m=view.getMonth();
 document.getElementById("month").textContent=M[m]+" "+y;
 const cal=document.getElementById("cal");
 cal.innerHTML=W.map(x=>`<div class="wd">${x}</div>`).join("");
 const first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)cal.insertAdjacentHTML("beforeend","<div></div>");
 for(let n=1;n<=total;n++){
   const d=new Date(y,m,n), a=daySlots(d), k=key(d);
   cal.insertAdjacentHTML("beforeend",`<button type="button" class="cell ${k===key(selected)?"sel":""}" data-k="${k}"><span class="num">${n}</span>${a.length?`<span class="count">${a.length} créneau${a.length>1?"x":""}</span>`:""}</button>`);
 }
 cal.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.k+"T12:00:00");render()});
 document.getElementById("dayTitle").textContent=`${selected.getDate()} ${M[selected.getMonth()]} ${selected.getFullYear()}`;
 const list=document.getElementById("slotList"), a=daySlots(selected);
 list.innerHTML=a.length?a.map((x,i)=>`<div class="slotrow ${TYPES[x.type].bg}" style="background:${TYPES[x.type].bg};color:${TYPES[x.type].fg}"><span class="slotdot" style="background:${TYPES[x.type].fg}"></span><div class="slotinfo"><div class="slottime">${x.start}</div><div class="slottype">${TYPES[x.type].label}</div></div><button class="btn soft" data-del="${i}">Supprimer</button></div>`).join(""):`<div class="hint">Aucun créneau enregistré pour cette journée.</div>`;
 list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let a=daySlots(selected),target=a[Number(b.dataset.del)];slots=slots.filter(v=>v!==`${target.date}|${target.start}|${target.type}`);save();render()});
}

document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
document.getElementById("add").onclick=()=>{document.getElementById("fdate").value=key(selected);document.getElementById("fstart").value="09:00";selectedType="all";document.querySelectorAll(".type-option").forEach(x=>x.classList.toggle("selected",x.dataset.type==="all"));document.getElementById("formCard").classList.add("show");document.getElementById("fstart").focus()};
document.getElementById("cancel").onclick=()=>document.getElementById("formCard").classList.remove("show");
document.querySelectorAll(".type-option").forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll(".type-option").forEach(x=>x.classList.toggle("selected",x===b))});

document.getElementById("form").onsubmit=e=>{
 e.preventDefault();
 const date=document.getElementById("fdate").value,start=document.getElementById("fstart").value;
 if(!date||!start)return;
 const v=`${date}|${start}|${selectedType}`;
 if(!slots.includes(v))slots.push(v);
 save();selected=new Date(date+"T12:00:00");view=new Date(selected.getFullYear(),selected.getMonth(),1);
 document.getElementById("formCard").classList.remove("show");render();
};

function buildPreview(){
 const y=view.getFullYear(),m=view.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 let cells="";
 for(let i=0;i<first;i++)cells+=`<div class="igday empty"></div>`;
 for(let n=1;n<=total;n++){
   const d=new Date(y,m,n),a=daySlots(d);
   cells+=`<div class="igday"><div class="igdate">${n}</div><div class="igtimes">${a.slice(0,3).map(x=>`<span style="background:${TYPES[x.type].bg};color:${TYPES[x.type].fg}">${x.start}</span>`).join("")}</div></div>`;
 }
 return `<div class="storytitle">Atelier PaulineB</div><div class="storysub">CRÉNEAUX DISPONIBLES · ${M[m].toUpperCase()} ${y}</div><div class="igweek">${W.map(x=>`<div>${x}</div>`).join("")}</div><div class="iggrid">${cells}</div><div class="iglegend"><div><i class="dot" style="background:${TYPES.all.fg}"></i>${TYPES.all.label}</div><div><i class="dot" style="background:${TYPESrestricted.fg}"></i>${TYPESrestricted.label}</div><div><i class="dot" style="background:${TYPESrestricted.fg}"></i>${TYPESrestricted.label}</div><div><i class="dot" style="background:${TYPES.jap.fg}"></i>${TYPES.jap.label}</div></div><div style="font-size:9px;font-weight:800;margin-top:9px">💌 Réservation en message privé</div>`;
}
document.getElementById("ig").onclick=()=>{document.getElementById("story").innerHTML=buildPreview();document.getElementById("igCard").classList.add("show")};
document.getElementById("close").onclick=()=>document.getElementById("igCard").classList.remove("show");

function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
document.getElementById("exportInsta").onclick=()=>{
 const y=view.getFullYear(),m=view.getMonth(),W0=1080,H0=1920,gx=62,gy=330,gap=8,cw=(W0-2*gx-gap*6)/7,ch=190;
 const first=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
 let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W0}" height="${H0}"><rect width="1080" height="1920" fill="#fff8fa"/><text x="540" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#33282d">Atelier PaulineB</text><text x="540" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#33282d">CRÉNEAUX DISPONIBLES · ${M[m].toUpperCase()} ${y}</text>`;
 W.forEach((x,i)=>svg+=`<text x="${gx+i*(cw+gap)+cw/2}" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#88777e">${x}</text>`);
 for(let n=1;n<=total;n++){let idx=first+n-1,row=Math.floor(idx/7),col=idx%7,x=gx+col*(cw+gap),yy=gy+row*(ch+gap),a=daySlots(new Date(y,m,n));svg+=`<rect x="${x}" y="${yy}" rx="16" width="${cw}" height="${ch}" fill="#fff" stroke="#eadde3" stroke-width="3"/><text x="${x+13}" y="${yy+32}" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#33282d">${n}</text>`;a.slice(0,3).forEach((z,j)=>{let t=TYPES[z.type],by=yy+52+j*43;svg+=`<rect x="${x+8}" y="${by}" rx="8" width="${cw-16}" height="32" fill="${t.bg}"/><text x="${x+cw/2}" y="${by+22}" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="${t.fg}">${esc(z.start)}</text>`})}
 const rows=Math.ceil((first+total)/7),ly=gy+rows*(ch+gap)+28;
 svg+=`<text x="65" y="${ly}" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#33282d">LÉGENDE</text>`;
 [["all",TYPES.all.label],["restricted",TYPESrestricted.label],["restricted",TYPESrestricted.label],["jap",TYPES.jap.label]].forEach((z,i)=>{let t=TYPES[z[0]],yy=ly+35+i*40;svg+=`<circle cx="76" cy="${yy-7}" r="9" fill="${t.fg}"/><text x="98" y="${yy}" font-family="Arial,sans-serif" font-size="18" fill="#4a3b41">${esc(z[1])}</text>`});
 svg+=`<text x="540" y="1865" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#33282d">💌 Réservation en message privé</text></svg>`;
 const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"})),img=new Image();
 img.onload=()=>{const c=document.createElement("canvas");c.width=W0;c.height=H0;const ctx=c.getContext("2d");ctx.fillStyle="#fff8fa";ctx.fillRect(0,0,W0,H0);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(async png=>{if(!png)return;const file=new File([png],"Atelier-PaulineB-disponibilites.png",{type:"image/png"});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Disponibilités Atelier PaulineB"});else{const a=document.createElement("a");a.href=URL.createObjectURL(png);a.download=file.name;a.click()}}catch(e){if(e.name!=="AbortError")alert("Impossible d'enregistrer la photo.")}},"image/png")};
 img.src=url;
};
render();
</script>
</body></html>
